{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Click&Clean</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="aurora-body auth-page dark">

    <div class="background-shapes"></div>

    <div class="app-container auth-shell page-transition">

        <div class="auth-hero card-enter">
            <span class="auth-badge">Click&Clean</span>
            <h1>Создайте аккаунт за минуту</h1>
            <p>Выберите роль, укажите контакты и начните пользоваться сервисом без задержек.</p>
        </div>

        <div class="glass-card auth-panel card-enter">
            <div class="auth-panel-header">
                <h2>Регистрация</h2>
                <p>Заполните данные, чтобы продолжить</p>
            </div>

            <form id="register-form" class="auth-form" autocomplete="on">
                <div class="form-field">
                    <span>Имя</span>
                    <input id="reg-name" type="text" placeholder="Как к вам обращаться" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <span>Телефон</span>
                    <input id="reg-phone" type="tel" placeholder="Например, +7 700 000 00 00" autocomplete="tel"
                        required>
                </div>

                <div class="form-field">
                    <span>Пароль</span>
                    <input id="reg-password" type="password" placeholder="Придумайте пароль" autocomplete="new-password"
                        required>
                </div>

                <div class="role-toggle auth-role-toggle" id="role-toggle">
                    <button type="button" class="role-pill active" data-role="client">Я клиент</button>
                    <button type="button" class="role-pill" data-role="courier">Я курьер</button>
                </div>
                <input type="hidden" id="reg-role" value="client">

                <div id="register-feedback" class="auth-feedback">
                    &nbsp;
                </div>

                <button id="register-submit" class="btn-primary full-btn" type="submit">Зарегистрироваться</button>
            </form>

            <div class="auth-meta">
                <span>Уже есть аккаунт?</span>
                <a class="auth-link" href="/login">Войти</a>
            </div>
        </div>

        <div class="auth-footer card-enter">
            <a class="auth-link subtle" href="/">← На главную</a>
            <button class="btn-link" type="button" id="theme-toggle">Сменить тему</button>
        </div>

    </div>

    <script src="{% static 'js/api.js' %}"></script>
    <script>
        (function () {
            const registerForm = document.getElementById('register-form');
            const nameInput = document.getElementById('reg-name');
            const phoneInput = document.getElementById('reg-phone');
            const passwordInput = document.getElementById('reg-password');
            const roleInput = document.getElementById('reg-role');
            const roleButtons = document.querySelectorAll('#role-toggle .role-pill');
            const feedbackEl = document.getElementById('register-feedback');
            const submitBtn = document.getElementById('register-submit');
            const themeToggle = document.getElementById('theme-toggle');

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    document.body.classList.toggle('dark');
                });
            }

            roleButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    roleButtons.forEach((item) => item.classList.remove('active'));
                    btn.classList.add('active');
                    if (roleInput) {
                        roleInput.value = btn.dataset.role || 'client';
                    }
                });
            });

            if (registerForm) {
                registerForm.addEventListener('submit', handleRegister);
            }

            function setFeedback(message = '', type = '') {
                if (!feedbackEl) {
                    return;
                }
                feedbackEl.textContent = message || '\u00a0';
                feedbackEl.classList.remove('error', 'success');
                if (type) {
                    feedbackEl.classList.add(type);
                }
            }

            function setLoading(isLoading) {
                if (!submitBtn) {
                    return;
                }
                submitBtn.disabled = isLoading;
                submitBtn.textContent = isLoading ? 'Создаём аккаунт...' : 'Зарегистрироваться';
            }

            function extractError(errors) {
                if (!errors) {
                    return '';
                }
                if (typeof errors === 'string') {
                    return errors;
                }
                if (Array.isArray(errors)) {
                    return errors[0] || '';
                }
                const firstKey = Object.keys(errors)[0];
                if (!firstKey) {
                    return '';
                }
                const value = errors[firstKey];
                if (Array.isArray(value)) {
                    return value[0] || '';
                }
                if (typeof value === 'string') {
                    return value;
                }
                return '';
            }

            async function handleRegister(event) {
                event.preventDefault();

                const name = nameInput ? nameInput.value.trim() : '';
                const phone = phoneInput ? phoneInput.value.trim() : '';
                const password = passwordInput ? passwordInput.value.trim() : '';
                const role = roleInput ? roleInput.value : 'client';

                if (!name || !phone || !password) {
                    setFeedback('Заполните все поля, пожалуйста.', 'error');
                    return;
                }

                setLoading(true);
                setFeedback();

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ phone, password, role, name })
                    });

                    let data = {};
                    try {
                        data = await response.json();
                    } catch (parseError) {
                        data = {};
                    }

                    if (response.ok && data && data.ok) {
                        setFeedback('Готово! Перенаправляем на вход...', 'success');
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 800);
                        return;
                    }

                    const errorMessage = (data && (data.error || extractError(data.errors))) || 'Не удалось создать аккаунт.';
                    setFeedback(errorMessage, 'error');
                } catch (networkError) {
                    setFeedback('Нет связи с сервером. Повторите попытку позже.', 'error');
                } finally {
                    setLoading(false);
                }
            }
        })();
    </script>

</body>

</html>
