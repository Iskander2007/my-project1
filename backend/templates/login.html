{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Click&Clean</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/ui.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-container fade-in">

        <h2 class="auth-title">Вход</h2>
        <p class="auth-subtitle">Добро пожаловать 👋</p>

        <div class="glass-card auth-card">

            <input id="login-phone" type="tel" class="input" placeholder="Телефон">
            <input id="login-password" type="password" class="input" placeholder="Пароль">

            <button class="btn-primary" onclick="login()">Войти</button>

            <p class="auth-bottom-text">
                Нет аккаунта? <a href="/register">Регистрация</a>
            </p>
        </div>

    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="goHome()">
            <img src="{% static 'icons/assets/nav-home.svg' %}">
            Главная
        </div>
        <div class="nav-item" onclick="goCourier()">
            <img src="{% static 'icons/assets/nav-courier.svg' %}">
            Курьер
        </div>
        <div class="nav-item" onclick="goProfile()">
            <img src="{% static 'icons/assets/nav-profile.svg' %}">
            Профиль
        </div>
        <div class="nav-item" onclick="toggleTheme()">
            <img src="{% static 'icons/assets/nav-theme.svg' %}">
            Тема
        </div>
    </div>

    <script src="{% static 'js/api.js' %}"></script>
    <script>
        function goHome() {
            window.location.href = '/';
        }
        function goCourier() {
            window.location.href = '/courier';
        }
        function goProfile() {
            window.location.href = '/profile';
        }
        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
        async function login() {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ phone, password })
            });
            const data = await res.json();
            if (data.ok) {
                if (window.ClickCleanAPI) {
                    ClickCleanAPI.setTokens(data);
                }
                await redirectByRole();
            } else {
                alert(data.error || 'Ошибка входа');
            }
        }

        async function redirectByRole() {
            if (!window.ClickCleanAPI) {
                window.location.href = '/profile';
                return;
            }
            try {
                const res = await ClickCleanAPI.fetch('/api/auth/me');
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const data = await res.json();
                if (data.ok && data.user) {
                    if (data.user.role === 'courier') {
                        window.location.href = '/courier';
                        return;
                    }
                    window.location.href = '/client';
                    return;
                }
            } catch (error) {
                console.error('Role redirect error', error);
            }
            window.location.href = '/profile';
        }
    </script>

</body>

</html>
