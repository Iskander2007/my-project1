<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Click&Clean — Клиент</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/animations.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="app-container page-transition">

    <!-- БЛОК ПРОФИЛЯ -->
    <div class="profile-block card-enter">
      <h2 class="profile-title">Здравствуйте 👋</h2>
      <p id="client-name" class="profile-info">Загрузка...</p>
      <p class="profile-info" id="client-phone"></p>
    </div>

    <!-- КНОПКА СОЗДАТЬ ЗАКАЗ -->
    <button class="btn-primary pulse" id="create-order-btn">
      + Создать заказ
    </button>

    <h3 style="margin: 18px 0 10px;">Ваши заказы</h3>

    <!-- СПИСОК ЗАКАЗОВ -->
    <div id="orders-list">
      <div class="skeleton" style="height: 60px; margin-bottom: 10px;"></div>
      <div class="skeleton" style="height: 60px; margin-bottom: 10px;"></div>
    </div>

  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="goHome()">
      <img src="assets/icons/home.svg">
      Главная
    </div>

    <div class="nav-item" onclick="goCourier()">
      <img src="assets/icons/courier.svg">
      Курьер
    </div>

    <div class="nav-item" onclick="goProfile()">
      <img src="assets/icons/user.svg">
      Профиль
    </div>

    <div class="nav-item" onclick="toggleTheme()">
      <img src="assets/icons/theme.svg">
      Тема
    </div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item">
      <img src="./assets/icons/home.svg">
      Главная
    </div>

    <div class="nav-item">
      <img src="./assets/icons/courier.svg">
      Курьер
    </div>

    <div class="nav-item">
      <img src="./assets/icons/user.svg">
      Профиль
    </div>

    <div class="nav-item">
      <img src="./assets/icons/theme.svg">
      Тема
    </div>
  </div>



  <script src="js/api.js"></script>
  <script src="js/client.js"></script>

</body>

</html>
