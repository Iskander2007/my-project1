<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Click&Clean — Профиль</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/animations.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container page-transition">

        <h2 class="card-enter">Профиль</h2>
        <p class="card-enter" style="color: var(--text-muted); margin-bottom: 18px;">Ваши данные</p>

        <!-- АВАТАР -->
        <div class="profile-avatar card-enter">
            <img id="avatar-img" src="assets/user.png" alt="avatar" class="avatar-img">

            <input type="file" id="avatarInput" accept="image/*" hidden>

            <button id="change-avatar-btn" class="btn-secondary" style="margin-top: 10px;"
                onclick="document.getElementById('avatarInput').click()">
                Сменить фото
            </button>
        </div>

        <!-- ДАННЫЕ -->
        <div class="glass-card card-enter" style="margin-top: 16px;">
            <h3 class="card-title">Имя</h3>
            <p id="profile-name" class="profile-text">Загрузка...</p>
            <button class="btn-primary" id="edit-name-btn">Изменить имя</button>
        </div>

        <div class="glass-card card-enter" style="margin-top: 16px;">
            <h3 class="card-title">Телефон</h3>
            <p id="profile-phone" class="profile-text">Загрузка...</p>
        </div>

        <!-- ВЫХОД -->
        <button id="logout-btn" class="btn-danger" style="margin-top: 26px;">
            Выйти
        </button>

    </div>


    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">

        <div class="nav-item" onclick="goHome()">
            <img src="assets/icons/home.svg">
            Главная
        </div>

        <div class="nav-item" onclick="goCourier()">
            <img src="assets/icons/courier.svg">
            Курьер
        </div>

        <div class="nav-item active" onclick="goProfile()">
            <img src="assets/icons/user.svg">
            Профиль
        </div>

        <!-- КНОПКА ТЕМЫ -->
        <div class="nav-item" onclick="toggleTheme()">
            <img src="assets/icons/theme.svg">
            Тема
        </div>

    </div>
    <div class="bottom-nav">
        <div class="nav-item">
            <img src="./assets/icons/home.svg">
            Главная
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/courier.svg">
            Курьер
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/user.svg">
            Профиль
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/theme.svg">
            Тема
        </div>
    </div>


    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
