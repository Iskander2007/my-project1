<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Click&Clean</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/animations.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-container fade-in">

        <h2 class="auth-title">Вход</h2>
        <p class="auth-subtitle">Добро пожаловать 👋</p>

        <div class="glass-card auth-card">

            <input id="login-phone" type="tel" class="input" placeholder="Телефон">
            <input id="login-password" type="password" class="input" placeholder="Пароль">

            <button class="btn-primary" onclick="login()">Войти</button>

            <p class="auth-bottom-text">
                Нет аккаунта? <a href="register.html">Регистрация</a>
            </p>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    

</body>

</html>
