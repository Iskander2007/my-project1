<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Click&Clean</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/animations.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-container fade-in">

        <h2 class="auth-title">Регистрация</h2>
        <p class="auth-subtitle">Создайте аккаунт</p>

        <div class="glass-card auth-card">

            <input id="reg-name" type="text" class="input" placeholder="Имя">
            <input id="reg-phone" type="tel" class="input" placeholder="Телефон">
            <input id="reg-password" type="password" class="input" placeholder="Пароль">

            <button class="btn-primary" onclick="register()">Зарегистрироваться</button>

            <p class="auth-bottom-text">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>

    </div>
    <div class="bottom-nav">
        <div class="nav-item">
            <img src="./assets/icons/home.svg">
            Главная
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/courier.svg">
            Курьер
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/user.svg">
            Профиль
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/theme.svg">
            Тема
        </div>
    </div>


    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
