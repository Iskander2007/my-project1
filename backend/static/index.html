<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Click&Clean</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/animations.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="welcome-body">

  <div class="welcome-screen fade-in">

    <!-- Логотип -->
    <div class="welcome-user">
      <img src="assets/user.png" alt="logo">
      <h1>Click&Clean</h1>
      <p class="subtitle">Удобная уборка. Быстро. Просто. Надёжно.</p>
    </div>

    <!-- Кнопки -->
    <div class="welcome-buttons">
      <button class="btn-primary" onclick="goLogin()">Войти</button>
      <button class="btn-secondary" onclick="goRegister()">Регистрация</button>
    </div>

  </div>
  

  <script>
    function goLogin() {
      window.location.href = "login.html";
    }
    function goRegister() {
      window.location.href = "register.html";
    }
  </script>

</body>

</html>
