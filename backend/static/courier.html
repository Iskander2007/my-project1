<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Click&Clean — Курьер</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/animations.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container page-transition">

        <!-- Статус -->
        <div class="glass-card card-enter" style="margin-bottom: 16px;">
            <h3 class="card-title">Статус</h3>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div id="courier-status" class="status-dot offline">Оффлайн</div>

                <label class="switch">
                    <input type="checkbox" id="status-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Карта районов -->
        <div class="glass-card card-enter" style="margin-bottom: 16px;">
            <h3 class="card-title">Активные зоны</h3>

            <div id="courier-map" class="fake-map">
                <div class="zone z1"></div>
                <div class="zone z2"></div>
                <div class="zone z3"></div>
                <div class="zone z4"></div>
            </div>
        </div>

        <!-- Лента заказов -->
        <h3 style="margin-bottom: 6px;">Доступные заказы</h3>

        <div id="courier-orders" style="margin-top: 10px;">
            <div class="skeleton" style="height: 70px; margin-bottom: 10px;"></div>
            <div class="skeleton" style="height: 70px; margin-bottom: 10px;"></div>
        </div>

    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="goHome()">
            <img src="assets/icons/home.svg">
            Главная
        </div>
    
        <div class="nav-item" onclick="goCourier()">
            <img src="assets/icons/courier.svg">
            Курьер
        </div>
    
        <div class="nav-item" onclick="goProfile()">
            <img src="assets/icons/user.svg">
            Профиль
        </div>
    
        <div class="nav-item" onclick="toggleTheme()">
            <img src="assets/icons/theme.svg">
            Тема
        </div>
    </div><div class="bottom-nav">
        <div class="nav-item">
            <img src="./assets/icons/home.svg">
            Главная
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/courier.svg">
            Курьер
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/user.svg">
            Профиль
        </div>
    
        <div class="nav-item">
            <img src="./assets/icons/theme.svg">
            Тема
        </div>
    </div>



    <script src="js/api.js"></script>
    <script src="js/courier.js"></script>

</body>

</html>
